<title>三個方向比較</title>
<style>

  .dir p { margin-top: 8px; font-size: 15px; line-height: 1.55; color: #444; }

<body>
  <h1>三個方向：P2 報告流程與分工 ／ P9 業是因，善是緣</h1>
  <div class="sub">內容已按導師 agent 意見修正（刪「指引三步」、P9 改用 L8 第42頁做錨點、刪「代人贖罪」）。字型全部係 Windows 內建。</div>
  <div class="dir">
    <div><h2>A 經書</h2><p>呂敬人式書籍設計。版框、版心、魚尾、注釋 ①②；P2 直排目次。靛藍＋墨。最安靜、最有學術書卷味。</p></div>
    <img src="dir-1/p02.png"><img src="dir-1/p09.png">
  </div>
  <div class="dir">
    <div><h2>C 斷言</h2><p>Assertion–Evidence。標題就係結論句；講義原頁截圖直接放上正文做證據。白底＋石綠。最清楚、最似學術簡報。</p></div>
    <img src="dir-2/p02.png"><img src="dir-2/p09.png">
  </div>
  <div class="dir">
    <div><h2>E 數字</h2><p>新瑞士大字報。佛教黃大色塊＋巨型數字（6、1/7、49）；細線網格。最大膽、最有記憶點。</p></div>
    <img src="dir-3/p02.png"><img src="dir-3/p09.png">
  </div>
